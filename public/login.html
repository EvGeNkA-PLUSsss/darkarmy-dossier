<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Вход — DarkArmy Dossier</title>
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="design.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="login-logo">
      <img src="/icons/icon-192.png" width="72" height="72" alt="DarkArmy Dossier" style="border-radius:18px;box-shadow:0 8px 28px rgba(230,57,70,.35)">
    </div>
    <h1>DarkArmy <span class="accent">Dossier</span></h1>
    <p class="login-sub">Введите учётные данные</p>
    <input name="username" placeholder="Логин" autocomplete="username" required>
    <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <p class="login-sub" style="margin-top:6px">
      Нет аккаунта? <a href="/register.html" style="color:var(--link)">Зарегистрироваться</a>
    </p>
    <p class="login-sub" style="margin-top:2px">
      Доступ и оплата AI: <a href="https://t.me/AgroDeveloper" target="_blank" rel="noopener" style="color:var(--link)">@AgroDeveloper</a>
    </p>
    <p id="err" class="err"></p>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
