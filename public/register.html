<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Регистрация — DarkArmy Dossier</title>
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="design.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body class="login-body">
  <form id="registerForm" class="login-card" autocomplete="on">
    <div class="login-logo">
      <img src="/icons/icon-192.png" width="72" height="72" alt="DarkArmy Dossier" style="border-radius:18px;box-shadow:0 8px 28px rgba(230,57,70,.35)">
    </div>
    <h1>DarkArmy <span class="accent">Dossier</span></h1>
    <p class="login-sub">Создание аккаунта</p>

    <input name="username" placeholder="Логин (3–64)" autocomplete="username" required minlength="3" maxlength="64">
    <input name="password" type="password" placeholder="Пароль" autocomplete="new-password" required minlength="8">
    <input name="inviteCode" placeholder="Код приглашения" autocomplete="off" required
           style="text-transform: uppercase; letter-spacing: .1em; font-weight: 600; text-align: center;">

    <button type="submit">Зарегистрироваться</button>
    <p class="login-sub" style="margin-top:6px">
      Уже есть аккаунт? <a href="/login.html" style="color:var(--link)">Войти</a>
    </p>
    <p id="err" class="err"></p>
  </form>
<script src="js/register.js"></script>
</body>
</html>
