# nginx — reverse proxy с HTTPS для DarkArmy Dossier.
# Сертификаты: certbot (Let's Encrypt) или свой.
# Сервер приложения: BIND_HOST=127.0.0.1, TRUST_PROXY=1, NODE_ENV=production.

upstream darkarmy_dossier {
    server 127.0.0.1:7561;
    keepalive 16;
}

server {
    listen 80;
    server_name dossier.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dossier.example.com;

    ssl_certificate     /etc/letsencrypt/live/dossier.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dossier.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Загрузки: до 2 ГБ (жёсткий лимит приложения), таймаут на большие файлы.
    client_max_body_size 2048m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://darkarmy_dossier;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SSE /api/events и стриминг Darcus: без буферизации.
    location ~ ^/(api/events|api/darcus/chat)$ {
        proxy_pass http://darkarmy_dossier;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
